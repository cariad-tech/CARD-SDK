name: Optima

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  OptimaAnalyzer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cariad-optima/optima-actions@v5
        with:
          toolstation-token: ${{ secrets.OPTIMA_TOKEN }}
          github-token: ${{ secrets.OPTIMA_GITHUB_TOKEN }}
          jfrog-user: ${{ secrets.OPTIMA_JFROG_USER }}
          jfrog-token: ${{ secrets.NEW_OPTIMA_JFROG_TOKEN }}
          
          snippet-scan: 'false'
          client-only: 'false'
          test-only: 'false'
          sdks: >
            python