name: Optima

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      release-version:
        description: 'Release label (e.g., v1.0.0)'
        required: false
        default: 'v1.0.0'

jobs:
  OptimaAnalyzer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cariad-optima/optima-actions@v5
        with:
          toolstation-token: ${{ secrets.OPTIMA_TOKEN }}
          github-token: ${{ secrets.OPTIMA_GITHUB_TOKEN }}
          jfrog-user: ${{ secrets.OPTIMA_JFROG_USER }}
          jfrog-token: ${{ secrets.OPTIMA_JFROG_TOKEN }}
          release-version: ${{ github.event.inputs.release-version }}
          
          snippet-scan: 'false'
          client-only: 'false'
          test-only: 'false'
          sdks: >
            python