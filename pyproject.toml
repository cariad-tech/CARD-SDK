[build-system]
requires = ["setuptools", "wheel"]           # ← no hard pin; avoids the error
build-backend = "setuptools.build_meta"

[project]
name = "card-sdk"
version = "0.1.0"
description = "CARD dataset SDK with Rerun visualization."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "CARD Team" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
]

dependencies = [
  "attrs>=25.3.0",
  "laspy>=2.5.4",
  "lazrs>=0.6.2",
  "numpy>=2.2,<3",
  "opencv-python>=4.11.0.86",
  "pillow>=11.1.0",
  "pyarrow>=19.0.1",
  "rerun-sdk>=0.23.2",
  "scipy>=1.15,<2",
  "typing_extensions>=4.12.2",
]

[project.scripts]
card-viz = "rerun_vis:cli_main"              # ← maps to src/rerun_vis.py

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["rerun_vis"]                    # ← single module package
