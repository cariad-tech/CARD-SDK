[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "card-sdk"
version = "0.1.1"  # ← bump
description = "CARD dataset SDK with Rerun visualization and a unified PyTorch dataloader."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "CARD Team" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
]

dependencies = [
  "attrs>=25.3.0",
  "laspy>=2.5.4",
  "lazrs>=0.6.2",
  "numpy>=1.26,<3",            # allow both NumPy 1.26 and 2.x
  "opencv-python>=4.11.0.86",
  "pillow>=11.1.0",
  "pyarrow>=19.0.1",
  "rerun-sdk>=0.23.2",
  "scipy>=1.15,<2",
  "typing_extensions>=4.12.2",
]

[project.optional-dependencies]
torch = [
  "torch>=2.4",
  "torchvision>=0.19",
]
viz = ["matplotlib>=3.9"]

[project.scripts]
card-viz = "rerun_vis:cli_main"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["rerun_vis"]

[tool.setuptools.packages.find]
where = ["src", "card_dataset"]
