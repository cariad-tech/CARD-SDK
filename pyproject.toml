[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "card"
version = "0.1.1"
description = "CARD dataset Rerun Visualization"
readme = "README.md"
requires-python = ">=3.10,<3.13"

dependencies = [
  "attrs==25.4.0",
  "laspy==2.6.1",
  "lazrs==0.8.0",
  "numpy==2.2.6",
  "pandas==2.3.3",
  "pyarrow==21.0.0",
  "scipy==1.16.2",
  "opencv-python==4.12.0.88",
  "pillow==11.3.0",
  "rerun-sdk==0.25.1",
  "typing_extensions==4.15.0",
  "requests>=2.21.0",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.9"]
torch = ["torch>=2.4", "torchvision>=0.19"]

[project.scripts]
card-viz = "rerun_vis:cli_main"

[tool.setuptools]
py-modules = ["rerun_vis"]
package-dir = {"" = "src", "card_dataset" = "card_dataset"}

[tool.setuptools.packages.find]
where = ["src", "card_dataset"]
