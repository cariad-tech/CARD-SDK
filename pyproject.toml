[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "card"
version = "0.1.1"
description = "CARD dataset SDK: loading, download, and visualization utilities"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
license-files = ["LICENSE"]

# Core dependencies required for the dataloader and downloader.
# All packages here are permissively licensed (Apache-2.0, BSD, MIT).
dependencies = [
  "laspy==2.6.1",
  "lazrs==0.8.0",
  "numpy>=1.26.0",
  "pillow>=10.0.0",
  "opencv-python-headless>=4.10.0",
  "huggingface-hub>=0.23.0",
]

[project.optional-dependencies]
# Interactive 3D visualization via Rerun and matplotlib.
viz = [
    "rerun-sdk==0.25.1",
    "matplotlib>=3.9",
]
# PyTorch integration for training pipelines.
torch = ["torch>=2.4", "torchvision>=0.19"]

[project.scripts]
card-viz = "rerun_vis:cli_main"

[tool.uv]
package = true

[tool.setuptools]
py-modules = ["rerun_vis"]
package-dir = {"" = "src"}
