[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "card-sdk"
version = "0.1.1"
description = "CARD dataset SDK with Rerun visualization and a unified PyTorch dataloader."
readme = "README.md"
requires-python = ">=3.10,<3.13"

# Core deps aligned for NumPy 2.x
dependencies = [
  "attrs>=25.3.0",
  "laspy>=2.5.4",
  "lazrs>=0.6.2",
  "numpy>=2",
  "pandas>=2.2.2",
  "pyarrow>=15",
  "scipy>=1.15",
  "opencv-python>=4.10",
  "pillow>=10.3",
  "rerun-sdk>=0.23.2",
  "typing_extensions>=4.12.2",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.9"]
torch = ["torch>=2.4", "torchvision>=0.19"]

[project.scripts]
card-viz = "rerun_vis:cli_main"

[tool.setuptools]
# 'rerun_vis.py' lives under src/
py-modules = ["rerun_vis"]

# Map both code roots:
#  - default packages come from 'src'
#  - the top-level 'card_dataset' package is mapped explicitly
[tool.setuptools.package-dir]
"" = "src"
card_dataset = "card_dataset"

# Auto-discover Python packages under these roots
[tool.setuptools.packages.find]
where = ["src", "card_dataset"]
